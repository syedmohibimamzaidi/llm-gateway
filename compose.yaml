name: gateway-day7

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway-dev-password
      POSTGRES_DB: gateway
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - day7_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gateway", "-d", "gateway"]
      interval: 3s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  migrate:
    image: postgres:16
    environment:
      PGPASSWORD: gateway-dev-password
    volumes:
      - ./migrations:/migrations:ro
    command: ["sh", "-c", "for file in /migrations/*.sql; do psql -h postgres -U gateway -d gateway -v ON_ERROR_STOP=1 -f \"$$file\" || exit 1; done"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gateway:gateway-dev-password@postgres:5432/gateway
      REDIS_URL: redis://redis:6379/0
      GATEWAY_PRICE_CONFIG_PATH: /app/prices.live.json
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 20

  dashboard:
    build: ./dashboard
    environment:
      GATEWAY_API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5174:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  day7_pgdata:
